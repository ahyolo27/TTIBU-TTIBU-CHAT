name: PR AI Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-ai-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review PR
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false

    steps:
      - name: Resolve PR context
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request?.number || Number(core.getInput('pr_number'));
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            core.setOutput('number', String(pr.number));
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('base_sha', pr.base.sha);
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('title', pr.title);
            core.setOutput('body', pr.body || '');

      - name: Checkout base repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.base_sha }}
          fetch-depth: 0

      - name: Fetch PR head
        run: git fetch origin pull/${{ steps.pr.outputs.number }}/head:pr-head --depth=1

      - name: Build review input
        id: diff
        shell: bash
        run: |
          set -euo pipefail

          git diff --name-status "${{ steps.pr.outputs.base_sha }}" pr-head > changed-files.txt
          git diff --name-only "${{ steps.pr.outputs.base_sha }}" pr-head |
            grep -Ev '(^|/)(package-lock\.json|pnpm-lock\.yaml|yarn\.lock|bun\.lockb|Cargo\.lock|composer\.lock|Gemfile\.lock|Pipfile\.lock|poetry\.lock|uv\.lock)$' |
            grep -Ev '(^|/)(dist|build|coverage|\.next|\.nuxt|node_modules)/' > review-files.txt || true

          if [ -s review-files.txt ]; then
            mapfile -t review_files < review-files.txt
            git diff --unified=24 --no-ext-diff "${{ steps.pr.outputs.base_sha }}" pr-head -- "${review_files[@]}" > pr.diff
          else
            : > pr.diff
          fi

          head -c 180000 pr.diff > review-diff.txt

      - name: Ask OpenAI for review
        id: openai
        uses: actions/github-script@v7
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_REVIEW_MODEL: ${{ vars.OPENAI_REVIEW_MODEL || 'gpt-5.3-codex' }}
          PR_TITLE: ${{ steps.pr.outputs.title }}
        with:
          script: |
            const fs = require('fs');

            if (!process.env.OPENAI_API_KEY) {
              throw new Error('Missing OPENAI_API_KEY repository secret.');
            }

            const changedFiles = fs.readFileSync('changed-files.txt', 'utf8');
            const reviewedFiles = fs.existsSync('review-files.txt')
              ? fs.readFileSync('review-files.txt', 'utf8')
              : '';
            const reviewDiff = fs.existsSync('review-diff.txt')
              ? fs.readFileSync('review-diff.txt', 'utf8')
              : '';

            const prompt = [
              'You are a senior software engineer reviewing a GitHub pull request.',
              'Focus on correctness, security, regressions, maintainability, and missing tests.',
              'Only comment when there is a concrete issue with clear impact.',
              'Avoid subjective style feedback.',
              'Do not comment on unchanged code unless it is directly affected by this PR.',
              'If there are no meaningful issues, say that clearly.',
              'Write the entire review in Korean. Be concise and specific.',
              '',
              `PR title: ${process.env.PR_TITLE}`,
              '',
              'Changed files:',
              changedFiles,
              '',
              'Files included in the review diff:',
              reviewedFiles || '(none)',
              '',
              'Diff:',
              reviewDiff || '(No reviewable diff after excluding lock files and generated outputs.)',
            ].join('\n');

            const response = await fetch('https://api.openai.com/v1/responses', {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${process.env.OPENAI_API_KEY}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                model: process.env.OPENAI_REVIEW_MODEL,
                input: prompt,
              }),
            });

            const body = await response.json();

            if (!response.ok) {
              throw new Error(`OpenAI API error ${response.status}: ${JSON.stringify(body)}`);
            }

            const text =
              body.output_text ||
              body.output?.flatMap((item) => item.content || [])
                .map((content) => content.text || '')
                .join('\n')
                .trim();

            if (!text) {
              throw new Error(`OpenAI API returned no review text: ${JSON.stringify(body)}`);
            }

            fs.writeFileSync('ai-review.md', text);

      - name: Create PR review comment
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          MODEL: ${{ vars.OPENAI_REVIEW_MODEL || 'gpt-5.3-codex' }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- pr-ai-review -->';
            const issue_number = Number(process.env.PR_NUMBER);
            const reviewBody = fs.readFileSync('ai-review.md', 'utf8');
            const reviewedAt = new Intl.DateTimeFormat('sv-SE', {
              timeZone: 'Asia/Seoul',
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
              hour: '2-digit',
              minute: '2-digit',
              hour12: false,
            }).format(new Date()).replace(' ', ' ');

            const body = [
              marker,
              reviewBody,
              '',
              `<sub>AI review | ${reviewedAt} KST | ${process.env.MODEL}</sub>`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body,
            });
